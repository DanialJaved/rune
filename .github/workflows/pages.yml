# Publishes site/ to GitHub Pages.
#
# There is no build step: the site is plain HTML and CSS, so this uploads the
# folder as it stands. Nothing to install, nothing to keep patched.
#
# REQUIRES a one-time repo setting: Settings -> Pages -> Source: "GitHub Actions".
# Without it this workflow fails at the deploy step with a 404.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  # So the site can be republished without a content change.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead. Cancelling a half-finished deploy
# is what leaves a Pages site serving a partial upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
